<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Todo List</h1>
        </header>
        
        <main class="app-main">
            <form class="todo-form" id="todo-form">
                <input 
                    type="text" 
                    class="todo-input" 
                    id="todo-input" 
                    placeholder="What needs to be done?"
                    autocomplete="off"
                    aria-label="Enter a new todo item"
                >
                <button type="submit" class="add-btn" aria-label="Add todo">Add</button>
            </form>

            <div class="todo-controls">
                <div class="filter-buttons" role="group" aria-label="Filter todos">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <button class="clear-completed-btn" id="clear-completed">Clear Completed</button>
            </div>

            <ul class="todo-list" id="todo-list" aria-label="Todo items"></ul>

            <footer class="app-footer">
                <span class="todo-count" id="todo-count">0 items left</span>
            </footer>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
